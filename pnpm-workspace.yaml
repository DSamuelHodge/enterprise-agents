packages:
  - "apps/*"
  - "packages/*"
overrides:
  "@cloudflare/vite-plugin": "1.48.0"
  "@hono/node-server": "2.0.12"
  axios: "1.19.0"
  brace-expansion: "5.0.8"
  esbuild: "0.28.1"
  fast-uri: "3.1.4"
  fast-xml-parser: "5.10.1"
  hono: "4.12.32"
  minimatch: "10.2.5"
  partyserver: "0.5.9"
  postcss: "8.5.25"
  sharp: "0.35.3"
  ws: "8.21.1"
onlyBuiltDependencies:
  - "@google/genai"
  - "@mongodb-js/zstd"
  - "@swc/core"
  - "bufferutil"
  - "core-js"
  - "core-js-pure"
  - "esbuild"
  - "keccak"
  - "node-liblzma"
  - "protobufjs"
  - "sharp"
  - "utf-8-validate"
  - "workerd"
allowBuilds:
  '@google/genai': true
  '@mongodb-js/zstd': true
  '@swc/core': true
  bufferutil: true
  core-js: true
  core-js-pure: true
  esbuild: true
  keccak: true
  node-liblzma: true
  protobufjs: true
  sharp: true
  utf-8-validate: true
  workerd: true
minimumReleaseAgeExclude:
  - postcss@8.5.25
  - partyserver@0.5.9
