name: Verify

on:
  pull_request:
  push:
    branches:
      - agent/**

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests and typechecks
        run: pnpm test

      - name: Build backend
        run: pnpm build:backend

      - name: Validate backend Worker bundle
        run: pnpm exec wrangler deploy --config dist/boilerplate_backend/wrangler.json --dry-run

      - name: Build frontend for Cloudflare
        run: pnpm build:frontend:cloudflare

      - name: Validate frontend Worker bundle
        run: pnpm exec wrangler deploy --config apps/frontend/wrangler.jsonc --dry-run
